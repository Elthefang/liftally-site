<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Liftally Firebase Staging Test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f2;
      --surface: #ffffff;
      --text: #262626;
      --muted: #667085;
      --border: rgba(38, 38, 38, 0.12);
      --accent: #fb4d3d;
      --ok: #087443;
      --warn: #a15c00;
      --fail: #b42318;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(920px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 0.95;
    }

    p {
      color: var(--muted);
      line-height: 1.55;
    }

    .panel {
      margin-top: 24px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 18px 40px rgba(38, 38, 38, 0.08);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 8px 14px;
      margin: 18px 0 0;
    }

    dt {
      color: var(--muted);
      font-weight: 700;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .log {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .log-row {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8faf9;
      font: 500 0.92rem ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }

    .log-row.pass { border-color: rgba(8, 116, 67, 0.32); color: var(--ok); }
    .log-row.warn { border-color: rgba(161, 92, 0, 0.32); color: var(--warn); }
    .log-row.fail { border-color: rgba(180, 35, 24, 0.32); color: var(--fail); }

    @media (max-width: 520px) {
      dl {
        grid-template-columns: 1fr;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Firebase Staging Test</h1>
    <p>This page is for local staging verification only. It is not linked from the public Liftally website.</p>

    <section class="panel" aria-labelledby="environmentTitle">
      <h2 id="environmentTitle">Environment</h2>
      <dl>
        <dt>Expected</dt>
        <dd>liftally-staging</dd>
        <dt>Loaded</dt>
        <dd id="loadedEnvironment">Waiting</dd>
        <dt>User</dt>
        <dd id="currentUser">Signed out</dd>
      </dl>
      <div class="actions">
        <button type="button" id="runSmokeTest">Run Smoke Test</button>
        <button class="secondary" type="button" id="signOutButton">Sign Out</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="logTitle">
      <h2 id="logTitle">Result Log</h2>
      <div class="log" id="log" aria-live="polite"></div>
    </section>
  </main>

  <script src="firebase/firebase-config.staging.js"></script>
  <script type="module" src="firebase/staging-smoke-test.js"></script>
</body>
</html>
